name: Frontend CI

on:
  push:
    branches: [develop, qa, main]
  pull_request:
    branches: [develop, qa, main]

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Build workspace libraries
        run: npm run build:all

      - name: Run unit tests
        run: npm run test:ci

      - name: Build production application
        run: npm run build

      # El prerender (build estático, el de producción) no debe hornear datos del API: ver scripts/verificar-prerender.mjs.
      - name: Build static prerender and verify no API data is baked in
        run: npx ng build main --configuration production,static && node scripts/verificar-prerender.mjs
