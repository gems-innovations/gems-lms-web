name: Frontend CD

# Construye la imagen (nginx + build estático) y la despliega en la VM de Oracle.
# La VM ya trae el compose del backend (gems-lms-api); aquí solo se actualiza el servicio "web".

on:
  push:
    branches: [develop, qa, main]

env:
  DEPLOY_ENV: ${{ github.ref == 'refs/heads/main' && 'pdn' || github.ref == 'refs/heads/qa' && 'qa' || 'dev' }}

permissions:
  contents: read

concurrency:
  group: frontend-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:all
      - run: npm run test:ci
      - name: Build estático (el mismo que usa la imagen)
        run: npx ng build main --configuration production,static

  image:
    needs: validate
    # La VM de Oracle es ARM (Ampere): se compila nativo en un runner ARM, sin emulación.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ghcr.io/gems-innovations/gems-web:${{ github.sha }}
            ghcr.io/gems-innovations/gems-web:${{ env.DEPLOY_ENV }}-latest

  deploy:
    needs: image
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'pdn' || github.ref == 'refs/heads/qa' && 'qa' || 'dev' }}
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -eu
            cd "$HOME/app"
            docker compose --env-file .env pull web
            docker compose --env-file .env up -d web
            docker image prune -f
