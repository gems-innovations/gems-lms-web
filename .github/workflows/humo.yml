name: Humo (regresión) sobre el build estático

# Recorridos básicos que no se pueden romper (visitante, retos, bloques, Taps, invitado, cuentas, permisos, paneles por
# rol, subdominios) contra el MISMO build que se despliega (`production,static`, servido como nginx), con el API
# simulado en el navegador: no toca producción, no crea cuentas ni invitados reales. Ver e2e/humo-soporte.ts.

# Corre en cada PR (ahí sí es requisito para mezclar) y, con `workflow_call`, en paralelo dentro de deploy.yml (Frontend CD),
# donde ya no bloquea la imagen ni el despliegue: solo avisa si main se rompe. Por eso ya no tiene disparador `push` propio (el CD cubre develop, qa y main).
on:
  pull_request:
    branches: [develop, qa, main, 'integracion/**']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: humo-${{ github.workflow }}-${{ github.ref }}
  # Solo se cancela la corrida vieja en PR. Llamado desde Frontend CD (push), `github.event_name` es el del llamador: no se cancela;
  # si no, un segundo push seguido a develop/qa/main dejaría sin humo (y su despliegue en rojo) al primero.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  humo:
    runs-on: ubuntu-latest
    # Imagen oficial con navegadores y dependencias ya instalados (sin apt-get en cada corrida; la versión debe ser la de @playwright/test).
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Build estático (el mismo del Dockerfile)
        run: npm run build:all && npx ng build main --configuration production,static


      - name: Suite de humo (Chromium + iPhone WebKit)
        env:
          E2E_ESTATICO: '1'
        # 90 s por prueba: con el plazo por defecto (30 s) 5 pruebas pesadas de Taps agotan el tiempo en máquinas lentas y, al ser requisito del CD, bloquearían el despliegue sin ser regresión.
        run: npx playwright test e2e/humo- --timeout=90000

      - name: Reporte si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-humo
          path: playwright-report
          retention-days: 7
