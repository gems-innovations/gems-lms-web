name: iPhone (Safari) contra producción

# El 40 % de las visitas reales llega desde iPhone. Recorre en celular, con el motor de Safari (WebKit),
# la portada, la ficha del curso, la entrada como invitado y el reproductor en lms.gemsinnovations.com.
# Nota: cada corrida crea un invitado en producción (como cualquier visitante); el contador de visitas se bloquea.

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'e2e/mobile-public.spec.ts'
      - 'playwright.config.ts'
      - '.github/workflows/iphone.yml'

permissions:
  contents: read

jobs:
  iphone:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Install WebKit
        run: npx playwright install --with-deps webkit

      - name: Recorrido de celular en iPhone (WebKit)
        env:
          E2E_BASE_URL: https://lms.gemsinnovations.com
        run: npx playwright test --project=iphone-webkit

      - name: Reporte si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-iphone
          path: playwright-report
          retention-days: 7
