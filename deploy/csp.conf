# CSP de la app. __API_ORIGIN__ lo reemplaza 40-gems-config.sh al arrancar el contenedor (origen de API_BASE_URL).
# Google (entrar con Google): script, estilos, iframe y conexión de accounts.google.com/gsi.
# GoatCounter: el script sale de gc.zgo.at y el conteo va a infogems.goatcounter.com.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline' https://gc.zgo.at https://accounts.google.com/gsi/client; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; img-src 'self' data: blob: https: __API_ORIGIN__; media-src 'self' blob: __API_ORIGIN__; frame-src https://accounts.google.com/gsi/ https://www.youtube.com https://www.youtube-nocookie.com https://player.vimeo.com; font-src 'self' data:; connect-src 'self' __API_ORIGIN__ https://infogems.goatcounter.com https://accounts.google.com/gsi/" always;
