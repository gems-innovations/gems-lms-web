server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Mismos encabezados que aplicaba el servidor SSR (projects/main/src/server.ts).
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: __API_ORIGIN__; media-src 'self' blob: __API_ORIGIN__; frame-src https://www.youtube.com https://www.youtube-nocookie.com https://player.vimeo.com; font-src 'self' data:; connect-src 'self' __API_ORIGIN__" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    location = /healthz { access_log off; add_header Content-Type text/plain; return 200 "ok"; }

    # El service worker vuelve a pedir las imágenes externas (portadas de cursos) y a ese fetch le aplica el
    # connect-src de SU propia respuesta: con 'self' y el API las portadas dejaban de verse en producción.
    location = /ngsw-worker.js {
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; connect-src 'self' https:" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri =404;
    }

    # Estos nunca deben quedar en caché: apuntan a la versión vigente.
    location ~ ^/(config\.js|ngsw\.json|safety-worker\.js|manifest\.webmanifest|index\.html)$ {
        add_header Cache-Control "no-store" always;
        # add_header en un location anula los del server: se repiten los de seguridad.
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: __API_ORIGIN__; media-src 'self' blob: __API_ORIGIN__; frame-src https://www.youtube.com https://www.youtube-nocookie.com https://player.vimeo.com; font-src 'self' data:; connect-src 'self' __API_ORIGIN__" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri /index.html;
    }

    # Los archivos con hash en el nombre son inmutables.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|webp|svg|ico|mp4|webm)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
