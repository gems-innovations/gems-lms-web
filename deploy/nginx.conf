# Front estático de GEMS LMS. El build (`ng build main --configuration production,static`) PRERENDERIZA las páginas
# públicas (app.routes.server.ts): cada una queda en <ruta>/index.html con su contenido y sus metadatos para compartir.
# Las demás rutas reciben la «shell» (index.csr.html) y se pintan en el navegador.

# Portada (/): en el subdominio de una institución (unal.gemsinnovations.com) la página depende de la institución, que
# solo se conoce en el navegador (TenantService). Ahí se entrega la shell; en el dominio principal, la portada
# prerenderizada. Mismas reglas que tenant-slug.ts: los subdominios reservados no son instituciones.
map $host $gems_home {
    default                                                                                             /index.html;
    "~^(www|lms|api|app|admin|auth|edu|mail|static|assets|cdn|dev|qa|pdn|prod|staging|test|preview)\."  /index.html;
    "~^[a-z0-9][a-z0-9-]{1,38}[a-z0-9]\.(gemsinnovations\.com|localhost)$"                              /index.csr.html;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    # Detrás del proxy del VM las redirecciones de nginx no deben llevar su propio host ni puerto.
    absolute_redirect off;

    # Compresión: los archivos de texto ya van precomprimidos (.gz, ver Dockerfile); el resto se comprime al vuelo.
    # gzip_proxied any: sin esto nginx NO comprime lo que llega a través de un proxy (cabecera Via).
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css text/plain text/javascript application/javascript application/json application/manifest+json image/svg+xml application/xml;

    include /etc/nginx/gems/security-headers.conf;
    include /etc/nginx/gems/csp.conf;

    location = /healthz { access_log off; default_type text/plain; return 200 "ok"; }

    # El service worker vuelve a pedir las imágenes externas (portadas de cursos) y a ese fetch le aplica el
    # connect-src de SU propia respuesta: con 'self' y el API las portadas dejaban de verse en producción.
    location = /ngsw-worker.js {
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; connect-src 'self' https:" always;
        include /etc/nginx/gems/security-headers.conf;
        try_files $uri =404;
    }

    # Estos nunca deben quedar en caché: apuntan a la versión vigente.
    location ~ ^/(?:config\.js|ngsw\.json|safety-worker\.js|worker-basic\.min\.js)$ {
        add_header Cache-Control "no-store" always;
        include /etc/nginx/gems/security-headers.conf;
        include /etc/nginx/gems/csp.conf;
        try_files $uri =404;
    }
    # mime.types de nginx no conoce .webmanifest (salía como application/octet-stream con nosniff).
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/gems/security-headers.conf;
        include /etc/nginx/gems/csp.conf;
        try_files $uri =404;
    }

    # Archivos con hash en el nombre (JS/CSS de Angular y lo que el CSS referencia en /media): inmutables.
    location ~ "^/(?:media/.+|[^/]+-[A-Za-z0-9_-]{8}\.(?:js|css))$" {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/gems/security-headers.conf;
        try_files $uri =404;
    }

    # Motor de Taps y sus temas (renderer3d.js, light.js, vendor, skins, texturas, theme.json): NO llevan hash, así que
    # se revalidan siempre (ETag → 304 si no cambiaron). Así un despliegue nunca mezcla versiones del motor.
    location ^~ /taps-engine/ {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/gems/security-headers.conf;
        try_files $uri =404;
    }

    # Otros estáticos sin hash (logos, fuentes de public/, imágenes para compartir): cambian poco; un día de caché.
    location ~* \.(?:js|mjs|css|json|map|woff2?|ttf|otf|png|jpe?g|webp|avif|gif|svg|ico|mp3|mp4|webm|ogg|txt)$ {
        add_header Cache-Control "public, max-age=86400" always;
        include /etc/nginx/gems/security-headers.conf;
        try_files $uri =404;
    }

    # Portada: prerenderizada o shell según el host (ver el map de arriba).
    location = / {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/gems/security-headers.conf;
        include /etc/nginx/gems/csp.conf;
        try_files $gems_home =404;
    }

    # Enlaces compartidos con el formato antiguo (/taps?t=nether): se entrega el HTML del Tap (/t/nether), que trae
    # su tarjeta para compartir. La URL no cambia y Angular hidrata el mismo feed con ese Tap primero.
    location = /taps {
        if ($arg_t ~ "^[a-z0-9-]{1,40}$") {
            rewrite ^ /t/$arg_t/index.html last;
        }
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/gems/security-headers.conf;
        include /etc/nginx/gems/csp.conf;
        try_files /taps/index.html /index.csr.html;
    }

    # Páginas: el HTML prerenderizado de la ruta si existe; si no, la shell. Siempre se revalida (no-cache + ETag).
    location / {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/gems/security-headers.conf;
        include /etc/nginx/gems/csp.conf;
        try_files $uri $uri/index.html /index.csr.html;
    }
}
