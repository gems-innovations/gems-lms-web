# Cabeceras de seguridad comunes (las mismas que aplicaba el servidor SSR, projects/main/src/server.ts).
# En nginx, un add_header dentro de un location ANULA los del server: por eso cada location incluye este archivo.
# Sin CSP: va aparte (csp.conf) porque el service worker necesita la suya.
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
