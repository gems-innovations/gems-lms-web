<div class="user-list">
  @for (user of users(); track user.id) {
    <div class="user-list__row" [class.user-list__row--inactive]="!user.isActive">

      <!-- Avatar -->
      <div class="user-list__avatar" [class.user-list__avatar--inactive]="!user.isActive">
        @if (user.avatarUrl) {
          <img [src]="user.avatarUrl" [alt]="user.firstName" class="user-list__avatar-img" />
        } @else {
          <span>{{ getInitials(user) }}</span>
        }
      </div>

      <!-- Info -->
      <div class="user-list__info">
        <span class="user-list__name">{{ user.firstName }} {{ user.lastName }}</span>
        <span class="user-list__email">{{ user.email }}</span>
        <span class="user-list__username">@{{ user.username }}</span>
      </div>

      <!-- Role badge -->
      <span class="user-list__role-badge {{ roleClasses[user.role] }}">
        {{ getRoleLabel(user.role) }}
      </span>

      <!-- Status -->
      <span
        class="user-list__status"
        [class.user-list__status--active]="user.isActive"
        [class.user-list__status--inactive]="!user.isActive"
      >
        {{ user.isActive ? 'Activo' : 'Suspendido' }}
      </span>

      <!-- Actions -->
      <div class="user-list__actions">
        <button
          type="button"
          class="user-list__action-btn"
          [title]="user.isActive ? 'Suspender' : 'Activar'"
          [attr.aria-label]="(user.isActive ? 'Suspender a ' : 'Activar a ') + user.firstName + ' ' + user.lastName"
          (click)="toggleStatus.emit(user.id)"
        >
          @if (user.isActive) {
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/>
            </svg>
          } @else {
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
              <polyline points="22 4 12 14.01 9 11.01"/>
            </svg>
          }
        </button>
        <button
          type="button"
          class="user-list__action-btn user-list__action-btn--danger"
          title="Eliminar usuario"
          [attr.aria-label]="'Eliminar a ' + user.firstName + ' ' + user.lastName"
          (click)="deleteUser.emit(user.id)"
        >
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="3 6 5 6 21 6"/>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
          </svg>
        </button>
      </div>

    </div>
  }
</div>
