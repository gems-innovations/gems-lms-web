<lib-page width="md">
  @if (uc.isLoading()) {
    <lib-loading-skeleton type="card" [rows]="3" />
  } @else if (uc.currentInstitution(); as inst) {
    <lib-page-header
      title="Mi Institución"
      subtitle="Gestiona la información y personalización de tu institución"
    >
      <lib-button variant="secondary" size="sm" (clicked)="editInstitution()">
        Editar Institución
      </lib-button>
    </lib-page-header>

    <adm-institution-overview-card [institution]="inst" (edit)="editInstitution()" />

    <adm-institution-branding-panel [branding]="inst.branding" />
  } @else {
    <lib-empty-state
      title="Sin institución asignada"
      description="Tu cuenta no tiene una institución vinculada. Contacta al super administrador."
    />
  }
</lib-page>

<adm-institution-modal-container />
