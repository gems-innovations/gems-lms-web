<div>
  @if (error()) {
    <div style="padding: 1rem; background: #fee; color: #c33; border: 1px solid #fcc; border-radius: 8px; margin-bottom: 1.5rem;">
      {{ error() }}
    </div>
  }

  <adm-institution-form
    [disabled]="isCreating()"
    (onSubmit)="onSubmit($event)"
    (onCancel)="onCancel()"
  />
</div>
