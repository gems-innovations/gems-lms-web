<adm-institution-page-header (onCreateNew)="onCreateNew()" />

<adm-dashboard-metrics
  [metrics]="dashboardMetrics()"

/>

<adm-institution-list
  [institutions]="institutions()"
  [isLoading]="isLoading()"
  [error]="error()"
  [pagination]="pagination()"
  [searchTerm]="searchTerm()"

  (onSearch)="onSearch($event)"
/>

<adm-institution-modal-container />
