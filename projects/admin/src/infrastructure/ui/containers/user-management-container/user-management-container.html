<lib-page width="md">
  <lib-page-header
    title="Gestión de Usuarios"
    subtitle="Crea y administra los usuarios de tu institución"
  >
    <lib-button variant="secondary" size="sm" (clicked)="uc.showImportPanel.set(true)">
      Importar Excel
    </lib-button>
    <lib-button variant="primary" size="sm" (clicked)="uc.showCreateForm.set(true)">
      Nuevo Usuario
    </lib-button>
  </lib-page-header>

  @if (uc.showImportPanel()) {
    <adm-user-import-panel
      [isImporting]="uc.isCreating()"
      (importUsers)="bulkImport($event)"
      (closed)="uc.showImportPanel.set(false)"
    />
  }

  <adm-user-stats-chips [users]="uc.users()" />

  @if (uc.showCreateForm()) {
    <adm-user-form
      [isCreating]="uc.isCreating()"
      (save)="createUser($event)"
      (closed)="uc.showCreateForm.set(false)"
    />
  }

  @if (uc.isLoading()) {
    <lib-loading-skeleton type="table" [rows]="6" />
  } @else if (uc.users().length === 0) {
    <lib-empty-state
      title="No hay usuarios aún"
      description="Crea el primer usuario para tu institución."
    />
  } @else {
    <adm-user-list
      [users]="uc.users()"
      (toggleStatus)="toggleStatus($event)"
      (deleteUser)="uc.requestDelete($event)"
    />
  }
</lib-page>

@if (uc.pendingDeleteId()) {
  <lib-confirmation-dialog
    type="danger"
    title="¿Eliminar usuario?"
    message="Esta acción no se puede deshacer."
    confirmText="Eliminar"
    cancelText="Cancelar"
    [isLoading]="uc.isDeleting()"
    (confirmed)="executeDelete()"
    (cancelled)="uc.cancelDelete()"
  />
}
