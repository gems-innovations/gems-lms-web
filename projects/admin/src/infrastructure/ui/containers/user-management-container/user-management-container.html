<lib-page width="md">
  <lib-page-header
    title="Gestión de Usuarios"
    subtitle="Crea y administra los usuarios de tu institución"
  >
    <lib-button variant="secondary" size="sm" (clicked)="showImportPanel.set(true)">
      Importar Excel
    </lib-button>
    <lib-button variant="primary" size="sm" (clicked)="showCreateForm.set(true)">
      Nuevo Usuario
    </lib-button>
  </lib-page-header>

  @if (showImportPanel()) {
    <adm-user-import-panel
      [isImporting]="isCreating()"
      (importUsers)="bulkImport($event)"
      (closed)="showImportPanel.set(false)"
    />
  }

  <adm-user-stats-chips [users]="users()" />

  @if (showCreateForm()) {
    <adm-user-form
      [isCreating]="isCreating()"
      (save)="createUser($event)"
      (closed)="showCreateForm.set(false)"
    />
  }

  @if (isLoading()) {
    <lib-loading-skeleton type="table" [rows]="6" />
  } @else if (users().length === 0) {
    <lib-empty-state
      title="No hay usuarios aún"
      description="Crea el primer usuario para tu institución."
    />
  } @else {
    <adm-user-list
      [users]="users()"
      (toggleStatus)="toggleStatus($event)"
      (deleteUser)="pendingDeleteId.set($event)"
    />
  }
</lib-page>

@if (pendingDeleteId()) {
  <lib-confirmation-dialog
    type="danger"
    title="¿Eliminar usuario?"
    message="Esta acción no se puede deshacer."
    confirmText="Eliminar"
    cancelText="Cancelar"
    [isLoading]="isDeleting()"
    (confirmed)="executeDelete()"
    (cancelled)="pendingDeleteId.set(null)"
  />
}
