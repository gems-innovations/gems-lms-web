<lib-page width="md">
  <lib-page-header title="Mi perfil" subtitle="Administra la información visible de tu cuenta" />
  @if (user(); as account) {
    <form class="profile" (submit)="$event.preventDefault(); save()">
      <section class="profile__avatar"><div class="profile__image">@if (avatarUrl) { <img [src]="avatarUrl" alt="Foto de perfil" /> } @else { {{ firstName.charAt(0) }}{{ lastName.charAt(0) }} }</div><lib-image-upload label="Cambiar foto" (uploaded)="avatarUrl = $event" /></section>
      <section class="profile__fields"><label>Nombre<input [(ngModel)]="firstName" name="firstName" required maxlength="50" /></label><label>Apellido<input [(ngModel)]="lastName" name="lastName" required maxlength="50" /></label><label>Usuario<input [(ngModel)]="username" name="username" maxlength="50" /></label><label>Correo<input [value]="account.email" disabled /></label></section>
      <section class="profile__meta"><span>{{ account.role }}</span><span>{{ account.institutionId || 'Cuenta global' }}</span></section>
      <button type="submit" [disabled]="saving()">{{ saving() ? 'Guardando…' : 'Guardar cambios' }}</button>
    </form>
  }
</lib-page>
