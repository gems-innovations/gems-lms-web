<lib-page width="md">
  <lib-page-header title="Mi perfil" subtitle="Administra la información visible de tu cuenta" />
  @if (user(); as account) {
    <form class="profile gems-enter" (submit)="$event.preventDefault(); save()">
      <section class="profile__avatar"><div class="profile__image">@if (avatarUrl) { <img [src]="avatarUrl" alt="Foto de perfil" /> } @else { {{ firstName.charAt(0) }}{{ lastName.charAt(0) }} }</div><lib-image-upload label="Cambiar foto" (uploaded)="avatarUrl = $event" /></section>
      <section class="profile__fields"><label>Nombre<input [(ngModel)]="firstName" name="firstName" required maxlength="50" /></label><label>Apellido<input [(ngModel)]="lastName" name="lastName" required maxlength="50" /></label><label>Usuario<input [(ngModel)]="username" name="username" maxlength="50" /></label><label>Correo<input [value]="account.email" disabled /></label></section>
      <section class="profile__meta"><span>{{ account.role }}</span><span>{{ account.institutionId || 'Cuenta global' }}</span></section>
      <button type="submit" [disabled]="saving()">{{ saving() ? 'Guardando…' : 'Guardar cambios' }}</button>
    </form>
    <section class="profile profile__preferences gems-enter" aria-labelledby="display-title"><h2 id="display-title">Preferencias de visualización</h2><p>Estas opciones se guardan solo en este dispositivo.</p><div class="profile__themes"><button type="button" [class.active]="display.preferences().theme === 'institution'" (click)="setTheme('institution')">Institución</button><button type="button" [class.active]="display.preferences().theme === 'dark'" (click)="setTheme('dark')">Oscuro</button><button type="button" [class.active]="display.preferences().theme === 'light'" (click)="setTheme('light')">Claro</button></div><label class="profile__toggle"><input type="checkbox" [checked]="display.preferences().compact" (change)="display.update({ compact: $any($event.target).checked })" /> Interfaz compacta</label><label class="profile__toggle"><input type="checkbox" [checked]="display.preferences().reducedMotion" (change)="display.update({ reducedMotion: $any($event.target).checked })" /> Reducir animaciones</label></section>
  }
</lib-page>
