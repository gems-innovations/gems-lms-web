<article class="hpsi" (click)="open.emit(entry().path.id)">
  <div class="hpsi__header">
    <div class="hpsi__icon">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
        <polyline points="3.27 6.96 12 12.01 20.73 6.96"/>
        <line x1="12" y1="22.08" x2="12" y2="12"/>
      </svg>
    </div>
    <span class="hpsi__pct">{{ pct() }}%</span>
  </div>

  <h4 class="hpsi__title">{{ entry().path.title }}</h4>
  <p class="hpsi__meta">{{ entry().path.steps.length }} cursos &nbsp;·&nbsp; {{ completed() }} completados</p>

  <div class="hpsi__bar">
    <div class="hpsi__bar-fill" [style.width]="pct() + '%'"></div>
  </div>
</article>
