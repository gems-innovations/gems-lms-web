<button type="button" class="icard" (click)="open.emit(course().id)">
  <div class="icard__thumb"
       [style.backgroundImage]="course().thumbnailUrl ? 'url(' + course().thumbnailUrl + ')' : null">
    @if (stats().pendingCount > 0) {
      <span class="icard__pending-badge">{{ stats().pendingCount }} por calificar</span>
    }
  </div>

  <div class="icard__body">
    <h3 class="icard__title">{{ course().title }}</h3>
    <div class="icard__stats">
      <span class="icard__stat">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
        {{ stats().studentCount }} estudiantes
      </span>
      <span class="icard__stat">{{ stats().avgProgress }}% avance</span>
    </div>
  </div>

  <svg class="icard__arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <polyline points="9 18 15 12 9 6"/>
  </svg>
</button>
