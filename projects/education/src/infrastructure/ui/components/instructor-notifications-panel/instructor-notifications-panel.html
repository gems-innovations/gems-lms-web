<div class="inotif">
  <button type="button" class="inotif__bell" (click)="toggle()">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
      <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
    </svg>
    @if (unreadCount() > 0) {
      <span class="inotif__badge">{{ unreadCount() }}</span>
    }
  </button>

  @if (open()) {
    <div class="inotif__backdrop" (click)="close()"></div>
    <div class="inotif__panel">
      <div class="inotif__header">
        <span>Notificaciones</span>
        @if (unreadCount() > 0) {
          <button type="button" class="inotif__clear" (click)="markAllRead.emit()">
            Marcar todas como leídas
          </button>
        }
      </div>

      @if (notifications().length === 0) {
        <div class="inotif__empty">No tienes notificaciones.</div>
      }

      @for (n of notifications(); track n.id) {
        <button type="button" class="inotif__item" [class.inotif__item--unread]="!n.read"
                (click)="select(n)">
          <div class="inotif__icon">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <polyline points="14 2 14 8 20 8"/>
            </svg>
          </div>
          <div class="inotif__body">
            <span class="inotif__title">{{ n.title }}</span>
            <span class="inotif__msg">{{ n.message }}</span>
            <span class="inotif__time">{{ timeAgo(n.createdAt) }}</span>
          </div>
          @if (!n.read) { <span class="inotif__dot"></span> }
        </button>
      }
    </div>
  }
</div>
