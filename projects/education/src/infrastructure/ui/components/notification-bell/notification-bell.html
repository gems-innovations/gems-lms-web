<div class="nbell" [class.nbell--left]="align() === 'left'" [class.nbell--up]="up()" [class.nbell--footer]="footer()">
  <button type="button" class="nbell__button" (click)="toggle()"
          [attr.aria-expanded]="open()" aria-label="Notificaciones" title="Notificaciones">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
      <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
    </svg>
    @if (service.unreadCount() > 0) {
      <span class="nbell__badge">{{ service.unreadCount() > 9 ? '9+' : service.unreadCount() }}</span>
    }
  </button>

  @if (open()) {
    <div class="nbell__backdrop" (click)="toggle()"></div>
    <div class="nbell__panel" role="dialog" aria-label="Notificaciones">
      <header class="nbell__header">
        <span class="nbell__title">Notificaciones</span>
        @if (service.unreadCount() > 0) {
          <button type="button" class="nbell__link" (click)="service.markAllRead()">Marcar todo como leído</button>
        }
      </header>
      @if (service.notifications().length === 0) {
        <p class="nbell__empty">No tienes notificaciones.</p>
      } @else {
        <ul class="nbell__list">
          @for (n of service.notifications(); track n.id) {
            <li>
              <button type="button" class="nbell__item" [class.nbell__item--unread]="!n.read" (click)="select(n)">
                <span class="nbell__item-title">{{ n.title }}</span>
                <span class="nbell__item-message">{{ n.message }}</span>
                <span class="nbell__item-date">{{ n.createdAt | date:'d MMM, HH:mm' }}</span>
              </button>
            </li>
          }
        </ul>
      }
    </div>
  }
</div>
