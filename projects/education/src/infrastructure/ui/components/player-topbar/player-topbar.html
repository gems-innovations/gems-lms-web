<header class="player-topbar">
  <div class="player-topbar__head">
    <div class="player-topbar__left">
      <button type="button" class="player-topbar__back" (click)="goHome.emit()" title="Volver al inicio">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      </button>

      <div class="player-topbar__divider"></div>

      <div class="player-topbar__breadcrumb">
        <span class="player-topbar__course-name">{{ courseTitle() }}</span>
        @if (lessonTitle()) {
          <span class="player-topbar__lesson-name">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="flex-shrink:0">
              <polyline points="9 18 15 12 9 6"/>
            </svg>
            {{ lessonTitle() }}
          </span>
        }
      </div>
    </div>

    <span class="player-topbar__percent">{{ progress() | number:'1.0-0' }}%</span>

    <div class="player-topbar__progress-track">
      <div class="player-topbar__progress-fill" [style.width.%]="progress()"></div>
    </div>
  </div>

  <div class="player-topbar__right">
    <button type="button" class="player-topbar__grades" (click)="openCommunity.emit()">Comunidad</button>
    <button type="button" class="player-topbar__grades" (click)="openGrades.emit()">Mis notas</button>
    @if (progress() > 0) {
      <span class="player-topbar__progress-chip">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
        {{ progress() | number:'1.0-0' }}%
      </span>
    }
    <button type="button" class="player-topbar__nav-btn" [disabled]="!hasPrev()" (click)="prev.emit()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
      Anterior
    </button>
    <button type="button" class="player-topbar__nav-btn player-topbar__nav-btn--next" [disabled]="!hasNext()" (click)="next.emit()">
      Siguiente
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <polyline points="9 18 15 12 9 6"/>
      </svg>
    </button>

    <div class="player-topbar__more">
      <button
        type="button"
        class="player-topbar__more-btn"
        aria-label="Más opciones"
        aria-haspopup="menu"
        [attr.aria-expanded]="menuOpen()"
        (click)="toggleMenu()"
      >
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <circle cx="12" cy="5" r="1.8"/>
          <circle cx="12" cy="12" r="1.8"/>
          <circle cx="12" cy="19" r="1.8"/>
        </svg>
      </button>

      @if (menuOpen()) {
        <div class="player-topbar__menu" role="menu">
          <button type="button" class="player-topbar__menu-item" role="menuitem" (click)="choose(openCommunity)">Comunidad</button>
          <button type="button" class="player-topbar__menu-item" role="menuitem" (click)="choose(openGrades)">Mis notas</button>
          <button type="button" class="player-topbar__menu-item" role="menuitem" (click)="choose(openProgress)">Avance</button>
        </div>
      }
    </div>
  </div>
</header>
