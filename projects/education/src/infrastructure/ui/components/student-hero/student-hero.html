<section class="shero">
  <!-- decorative background layers -->
  <div class="shero__orb shero__orb--purple"></div>
  <div class="shero__orb shero__orb--teal"></div>
  <div class="shero__grid"></div>

  <div class="shero__inner">
    <!-- left: copy -->
    <div class="shero__copy">
      <p class="shero__eyebrow">
        <span class="shero__eyebrow-dot"></span>
        {{ greeting() }}
      </p>
      <h1 class="shero__title">
        Tu próxima habilidad<br />
        <span class="shero__gradient">te está esperando.</span>
      </h1>
      <p class="shero__sub">
        Retoma donde lo dejaste, descubre nuevo contenido y convierte cada lección en una ventaja real.
      </p>
      <div class="shero__actions">
        <button class="shero__btn-primary" type="button" (click)="explore.emit()">
          Explorar catálogo
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polyline points="9 18 15 12 9 6"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- right: stats glass card -->
    <div class="shero__card" libReveal>
      <div class="shero__card-header">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
        </svg>
        Resumen de progreso
      </div>

      <div class="shero__ring-wrap">
        <svg class="shero__ring" viewBox="0 0 80 80">
          <circle cx="40" cy="40" r="32" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="6"/>
          <circle
            cx="40" cy="40" r="32"
            fill="none"
            stroke="url(#heroRingGrad)"
            stroke-width="6"
            stroke-linecap="round"
            stroke-dasharray="201"
            [attr.stroke-dashoffset]="201 - (201 * progressPct() / 100)"
            transform="rotate(-90 40 40)"
          />
          <defs>
            <linearGradient id="heroRingGrad" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="var(--color-primario)"/>
              <stop offset="100%" stop-color="var(--color-teal)"/>
            </linearGradient>
          </defs>
        </svg>
        <div class="shero__ring-label">
          <span class="shero__ring-pct" [libCountUp]="progressPct()" suffix="%"></span>
        </div>
      </div>

      <div class="shero__stats">
        <div class="shero__stat">
          <span class="shero__stat-icon shero__stat-icon--purple">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
              <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
            </svg>
          </span>
          <span class="shero__stat-text">
            <strong [libCountUp]="enrolledCount()"></strong> matriculados
          </span>
        </div>
        <div class="shero__stat">
          <span class="shero__stat-icon shero__stat-icon--green">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <polyline points="20 6 9 17 4 12"/>
            </svg>
          </span>
          <span class="shero__stat-text">
            <strong [libCountUp]="completedCount()"></strong> completados
          </span>
        </div>
        <div class="shero__stat">
          <span class="shero__stat-icon shero__stat-icon--teal">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
            </svg>
          </span>
          <span class="shero__stat-text">
            <strong [libCountUp]="activePathsCount()"></strong> rutas activas
          </span>
        </div>
      </div>
      <edu-achievements-card variant="inline" />
    </div>
  </div>
</section>
