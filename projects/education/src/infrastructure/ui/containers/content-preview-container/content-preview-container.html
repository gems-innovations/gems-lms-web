@if (uc.isLoading()) {
  <lib-loading-skeleton [rows]="8" />
} @else if ((uc.previewType() === 'course' ? uc.course() : uc.path()) === null) {
  <lib-empty-state
    title="Este contenido ya no está disponible"
    description="Puede que haya sido retirado o que no tengas acceso a él."
    actionLabel="Volver al catálogo"
    (action)="back()"
  />
} @else {
  <edu-preview-hero
    [type]="uc.previewType()"
    [course]="uc.course()"
    [path]="uc.path()"
    [isEnrolled]="uc.isEnrolled()"
    [blockedReason]="uc.blockedReason()"
    [enrollmentInfo]="enrollmentInfo()"
    (enroll)="uc.enroll()"
    (play)="play()"
    (back)="back()"
  />

  @if (uc.previewType() === 'course' && uc.course(); as c) {
    <edu-preview-course-outline [course]="c" />
  }

  @if (uc.previewType() === 'path' && uc.path(); as p) {
    <edu-preview-path-sequence [path]="p" />
  }
}
