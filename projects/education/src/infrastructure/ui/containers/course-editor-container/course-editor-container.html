<edu-course-editor-topbar (back)="goBack()" />

@if (!uc.course()) {
  <div class="ceditor__loading">
    <div class="ceditor__spinner"></div>
    <p>Cargando curso…</p>
  </div>
}

@if (uc.course()) {
  <div class="ceditor__main">
    <edu-course-curriculum-tree />
    <edu-course-editor-panel />
  </div>
}
