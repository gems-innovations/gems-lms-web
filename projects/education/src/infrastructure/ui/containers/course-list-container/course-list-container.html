<lib-page width="full">
  <lib-page-header
    title="Cursos"
    subtitle="Gestiona y crea el contenido educativo de tu plataforma"
  >
    <lib-button variant="primary" size="sm" (clicked)="createCourse()">
      Nuevo Curso
    </lib-button>
  </lib-page-header>

  <lib-stat-grid>
    <lib-stat-card [value]="uc.stats().total" label="Total" />
    <lib-stat-card [value]="uc.stats().published" label="Publicados" accent="success" />
    <lib-stat-card [value]="uc.stats().draft" label="Borradores" accent="warning" />
    <lib-stat-card [value]="uc.stats().totalEnrolled" label="Estudiantes" accent="teal" />
  </lib-stat-grid>

  <lib-toolbar>
    <lib-search-bar
      placeholder="Buscar por título o etiqueta…"
      [value]="searchTerm()"
      (search)="onSearch($event)"
      (clear)="onSearch('')"
    />
    <lib-tabs [tabs]="statusTabs" [activeId]="activeTab()" (activeIdChange)="onTabChange($event)" />
  </lib-toolbar>

  @if (uc.isLoading()) {
    <lib-skeleton shape="list-item" [count]="6" label="Cargando contenido" />
  } @else if (uc.filteredCourses().length === 0) {
    <lib-empty-state
      title="No hay cursos"
      [description]="searchTerm() ? 'Ningún curso coincide con tu búsqueda.' : 'Crea tu primer curso para empezar.'"
      [actionLabel]="searchTerm() ? undefined : 'Crear Curso'"
      (action)="createCourse()"
    />
  } @else {
    <lib-card-grid>
      @for (course of uc.filteredCourses(); track course.id) {
        <edu-course-card
          [course]="course"
          (publish)="uc.publishCourse($event)"
          (archive)="uc.archiveCourse($event)"
          (edit)="openEditor($event)"
          (remove)="uc.openModal('delete', $event)"
        />
      }
    </lib-card-grid>
  }
</lib-page>

@if (uc.showDeleteDialog()) {
  <lib-confirmation-dialog
    type="danger"
    title="Eliminar curso"
    [message]="'¿Estás seguro de que deseas eliminar ' + (uc.selectedCourse()?.title ?? 'este curso') + '? Esta acción no se puede deshacer.'"
    confirmText="Eliminar"
    cancelText="Cancelar"
    [isLoading]="uc.isDeleting()"
    (confirmed)="confirmDelete()"
    (cancelled)="uc.closeModal()"
  />
}

<lib-modal-base
  [isOpen]="uc.showCreateDialog()"
  title="Nuevo curso"
  size="medium"
  [showFooter]="false"
  [closeOnOverlayClick]="!uc.isSaving()"
  (close)="closeCreate()"
>
  <form class="ncform" (submit)="$event.preventDefault(); submitCreate()">
    <span class="ncform__label">Empezar desde</span>
    <div class="ncform__templates" role="radiogroup" aria-label="Empezar desde">
      <button type="button" role="radio" class="ncform__tpl" [class.ncform__tpl--on]="!newTemplate()" [attr.aria-checked]="!newTemplate()" (click)="pickTemplate('')">
        <strong>En blanco</strong><span>Tú armas todo.</span>
      </button>
      @for (t of templates; track t.id) {
        <button type="button" role="radio" class="ncform__tpl" [class.ncform__tpl--on]="newTemplate() === t.id" [attr.aria-checked]="newTemplate() === t.id" (click)="pickTemplate(t.id)">
          <strong>{{ t.title }}</strong><span>{{ t.summary }}</span>
        </button>
      }
    </div>

    <label class="ncform__field">Título
      <input type="text" name="title" maxlength="120" [value]="newTitle()" (input)="newTitle.set($any($event.target).value)" />
    </label>
    <label class="ncform__field">Descripción
      <textarea name="description" rows="3" [value]="newDescription()" (input)="newDescription.set($any($event.target).value)"></textarea>
    </label>
    <label class="ncform__field">Dificultad
      <select name="difficulty" [value]="newDifficulty()" (change)="newDifficulty.set($any($event.target).value)">
        @for (d of difficulties; track d.value) { <option [value]="d.value" [selected]="d.value === newDifficulty()">{{ d.label }}</option> }
      </select>
    </label>

    <div class="ncform__actions">
      <lib-button variant="secondary" size="sm" (clicked)="closeCreate()">Cancelar</lib-button>
      <button type="submit" class="ncform__submit" [disabled]="!canCreate() || uc.isSaving()">{{ uc.isSaving() ? 'Creando…' : 'Crear curso' }}</button>
    </div>
  </form>
</lib-modal-base>
