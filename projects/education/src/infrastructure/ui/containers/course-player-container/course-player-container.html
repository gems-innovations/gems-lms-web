@if (uc.isLoading()) {
  <lib-loading-skeleton [rows]="10" />
} @else if (uc.course(); as c) {
  <div class="course-player-container">
    <edu-player-topbar
      [courseTitle]="c.title"
      [lessonTitle]="uc.selectedLesson()?.title"
      [hasPrev]="uc.hasPrevBlock()"
      [hasNext]="uc.hasNextBlock() || uc.hasNextLesson()"
      [progress]="uc.courseProgress()"
      (goHome)="goHome()"
      (prev)="uc.prevBlock()"
      (next)="uc.nextBlock()"
    />

    <div class="course-player-container__body">
      <main class="course-player-container__content">
        <edu-player-content-block
          [block]="uc.selectedBlock()"
          [courseId]="uc.courseId()"
          [lessonId]="uc.selectedLessonId()"
          [isSubmitting]="uc.isSubmitting()"
          [lastQuizResult]="uc.lastQuizResult()"
          [isComplete]="uc.isBlockComplete()"
          (quizSubmit)="handleQuizSubmit($event)"
          (assignmentSubmit)="handleAssignmentSubmit($event)"
          (markComplete)="uc.markComplete()"
        />
      </main>

      <edu-player-sidebar
        [style.flex]="sidebarWidthPx() !== null ? '0 0 ' + sidebarWidthPx() + 'px' : '0 0 30%'"
        [style.minWidth]="'320px'"
        [style.maxWidth]="'60%'"
        [course]="c"
        [selectedLessonId]="uc.selectedLessonId()"
        [selectedBlockId]="uc.selectedBlock()?.id ?? null"
        [completedBlockIds]="uc.completedBlockIds()"
        [courseProgress]="uc.courseProgress()"
        [sidebarWidthPx]="sidebarWidthPx()"
        (selectLesson)="uc.selectLesson($event)"
        (selectBlock)="uc.selectBlock($event)"
        (resizeStart)="startSidebarResize($event)"
      />
    </div>
  </div>
} @else {
  <lib-empty-state
    title="Curso no encontrado"
    description="Este curso no existe o no tienes acceso."
  />
}
