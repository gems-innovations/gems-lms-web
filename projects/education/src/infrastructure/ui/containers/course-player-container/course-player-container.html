@if (isLoading()) {
  <lib-loading-skeleton [rows]="10" />
} @else if (course(); as c) {
  <div class="cplayer">
    <edu-player-topbar
      [courseTitle]="c.title"
      [lessonTitle]="selectedLesson()?.title"
      [hasPrev]="hasPrevBlock()"
      [hasNext]="hasNextBlock() || hasNextLesson()"
      (goHome)="goHome()"
      (prev)="prevBlock()"
      (next)="nextBlock()"
    />

    <div class="cplayer__body">
      <main class="cplayer__content">
        <edu-player-content-block
          [block]="selectedBlock()"
          [courseId]="courseId()"
          [lessonId]="selectedLessonId()"
          [isSubmitting]="isSubmitting()"
          [lastQuizResult]="lastQuizResult()"
          [isComplete]="isBlockComplete()"
          (quizSubmit)="handleQuizSubmit($event)"
          (assignmentSubmit)="handleAssignmentSubmit($event)"
          (markComplete)="markComplete()"
        />
      </main>

      <edu-player-sidebar
        [course]="c"
        [selectedLessonId]="selectedLessonId()"
        [completedBlockIds]="completedBlockIds()"
        [courseProgress]="courseProgress()"
        [sidebarWidth]="sidebarWidth()"
        [collapsed]="sidebarCollapsed()"
        (selectLesson)="selectLesson($event)"
        (toggleCollapse)="sidebarCollapsed.update(v => !v)"
        (resizeStart)="startSidebarResize($event)"
      />
    </div>
  </div>
} @else {
  <lib-empty-state
    title="Curso no encontrado"
    description="Este curso no existe o no tienes acceso."
  />
}
