<edu-lp-editor-topbar (back)="goBack()" />

@if (uc.isLoading()) {
  <div class="lpeditor__loading">
    <lib-skeleton shape="list-item" [count]="3" label="Cargando contenido" />
  </div>
} @else if (uc.path()) {
  <div class="lpeditor__main">
    <edu-lp-editor-sidebar />
    <edu-lp-editor-sequencer />
  </div>
} @else {
  <lib-empty-state title="No pudimos abrir la ruta" description="La ruta no está disponible o hubo un problema de conexión." actionLabel="Reintentar" (action)="uc.retry()" />
}
