<lib-page width="full">
  <lib-page-header
    title="Rutas de Aprendizaje"
    subtitle="Diseña itinerarios de cursos con objetivos de aprendizaje estructurados"
  >
    <lib-button variant="primary" size="sm" (clicked)="createPath()">
      Nueva Ruta
    </lib-button>
  </lib-page-header>

  <lib-stat-grid>
    <lib-stat-card [value]="uc.stats().total" label="Total" />
    <lib-stat-card [value]="uc.stats().published" label="Publicadas" accent="success" />
    <lib-stat-card [value]="uc.stats().draft" label="Borradores" accent="warning" />
    <lib-stat-card [value]="uc.stats().totalEnrolled" label="Estudiantes" accent="teal" />
  </lib-stat-grid>

  <lib-toolbar>
    <lib-search-bar
      placeholder="Buscar por nombre o etiqueta…"
      [value]="searchTerm()"
      (search)="onSearch($event)"
      (clear)="onSearch('')"
    />
    <lib-tabs [tabs]="statusTabs" [activeId]="activeTab()" (activeIdChange)="onTabChange($event)" />
  </lib-toolbar>

  @if (uc.isLoading()) {
    <lib-loading-skeleton type="card" [rows]="3" />
  } @else if (uc.filteredPaths().length === 0) {
    <lib-empty-state
      title="No hay rutas de aprendizaje"
      [description]="searchTerm() ? 'Ninguna ruta coincide con tu búsqueda.' : 'Crea tu primera ruta de aprendizaje.'"
      [actionLabel]="searchTerm() ? undefined : 'Crear Ruta'"
      (action)="createPath()"
    />
  } @else {
    <lib-card-grid>
      @for (path of uc.filteredPaths(); track path.id) {
        <edu-path-card
          [path]="path"
          (publish)="uc.publishPath($event)"
          (archive)="uc.archivePath($event)"
          (edit)="openEditor($event)"
          (remove)="uc.openModal('delete', $event.id)"
        />
      }
    </lib-card-grid>
  }
</lib-page>

@if (showDeleteDialog()) {
  <lib-confirmation-dialog
    type="danger"
    title="Eliminar ruta"
    [message]="'¿Estás seguro de que deseas eliminar ' + (uc.selectedLearningPath()?.title ?? 'esta ruta') + '? Esta acción no se puede deshacer.'"
    confirmText="Eliminar"
    cancelText="Cancelar"
    [isLoading]="uc.isDeleting()"
    (confirmed)="confirmDelete()"
    (cancelled)="uc.closeModal()"
  />
}
