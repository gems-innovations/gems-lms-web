@if (uc.isLoading()) {
  <lib-loading-skeleton [rows]="8" />
} @else if (uc.learningPath(); as path) {
  <edu-path-player-hero
    [path]="path"
    [overallProgress]="uc.overallProgress()"
    [completedCount]="uc.completedCount()"
    [isEnrolled]="uc.isEnrolled()"
    (goHome)="goHome()"
  />
  <edu-path-step-list
    [stepEntries]="uc.stepEntries()"
    (startCourse)="startCourse($event)"
  />
} @else {
  <lib-empty-state [copy]="copy.common.contentGone" title="No encontramos esta ruta" [headingLevel]="2" actionLink="/learn/catalog" />
}
