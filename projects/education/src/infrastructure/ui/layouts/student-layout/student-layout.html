<div class="slayout">

  <!-- ── Top Navigation ── -->
  <nav class="slayout__nav">
    <div class="slayout__nav-inner">

      <!-- Brand -->
      <a class="slayout__brand" routerLink="/learn/home">
        <div class="slayout__brand-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
            <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
          </svg>
        </div>
        <span class="slayout__brand-name">GEMS LMS</span>
      </a>

      <!-- Nav links -->
      <div class="slayout__nav-links">
        <a class="slayout__nav-link" routerLink="/learn/home" routerLinkActive="slayout__nav-link--active"
           [routerLinkActiveOptions]="{ exact: true }">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            <polyline points="9 22 9 12 15 12 15 22"/>
          </svg>
          Inicio
        </a>
        <a class="slayout__nav-link" routerLink="/learn/home" routerLinkActive="slayout__nav-link--active">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
          </svg>
          Mis Cursos
        </a>
      </div>

      <!-- Right actions -->
      <div class="slayout__nav-right">
        @if (canAccessAdmin()) {
          <button class="slayout__admin-btn" (click)="goToAdmin()" title="Ir al panel de cursos">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
              <rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
            </svg>
            Panel
          </button>
        }
        <div class="slayout__user-menu">
          <div class="slayout__avatar" [title]="user()?.firstName + ' ' + user()?.lastName">
            @if (user()?.avatarUrl) {
              <img [src]="user()!.avatarUrl" [alt]="user()!.firstName" class="slayout__avatar-img" />
            } @else {
              <span>{{ initials() }}</span>
            }
          </div>
          <button class="slayout__logout-btn" (click)="logout()" title="Cerrar sesión">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
              <polyline points="16 17 21 12 16 7"/>
              <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
          </button>
        </div>
      </div>

    </div>
  </nav>

  <!-- ── Main content ── -->
  <main class="slayout__main">
    <router-outlet />
  </main>

</div>
