<div class="slayout">

  <!-- ── Left sidebar nav ─────────────────────────────────────────────────── -->
  <aside class="slayout__leftnav"
         [class.slayout__leftnav--collapsed]="sidebarCollapsed()">

    <!-- Brand -->
    <a class="slayout__brand" routerLink="/learn/home">
      <div class="slayout__brand-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
          <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
        </svg>
      </div>
      <span class="slayout__brand-name">GEMS LMS</span>
    </a>

    <!-- Nav links -->
    <nav class="slayout__navlinks">
      <a class="slayout__navlink" routerLink="/learn/home" routerLinkActive="slayout__navlink--active"
         [routerLinkActiveOptions]="{ exact: true }" title="Inicio">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        <span class="slayout__navlink-label">Inicio</span>
      </a>

      <a class="slayout__navlink" routerLink="/learn/my-learning" routerLinkActive="slayout__navlink--active" title="Mi Aprendizaje">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
          <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
          <polyline points="12 11 12 14"/>
        </svg>
        <span class="slayout__navlink-label">Mi Aprendizaje</span>
      </a>

      <a class="slayout__navlink" routerLink="/learn/catalog" routerLinkActive="slayout__navlink--active" title="Catálogo">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <span class="slayout__navlink-label">Catálogo</span>
      </a>

      @if (canAccessAdmin()) {
        <div class="slayout__divider"></div>
        <a class="slayout__navlink" routerLink="/instructor" routerLinkActive="slayout__navlink--active" title="Gestión docente">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
          </svg>
          <span class="slayout__navlink-label">Gestión docente</span>
        </a>
      }
    </nav>


    <!-- User section -->
    <div class="slayout__user">
      <lib-avatar
        [name]="(user()?.firstName ?? '') + ' ' + (user()?.lastName ?? '')"
        [imageUrl]="user()?.avatarUrl"
        size="xs"
      />
      <div class="slayout__user-info">
        <span class="slayout__user-name">{{ user()?.firstName }} {{ user()?.lastName }}</span>
        <span class="slayout__user-role">Estudiante</span>
      </div>
      <button class="slayout__signout-btn" (click)="logout()" title="Cerrar sesión">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
      </button>
    </div>

  </aside>

  <!-- Collapse toggle — fuera del aside para no ser clippeado por overflow:hidden -->
  <button class="slayout__toggle-btn" (click)="toggleSidebar()"
          [title]="sidebarCollapsed() ? 'Expandir menú' : 'Contraer menú'">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <polyline [attr.points]="sidebarCollapsed() ? '9 18 15 12 9 6' : '15 18 9 12 15 6'"/>
    </svg>
  </button>

  <!-- ── Main content ─────────────────────────────────────────────────────── -->
  <main class="slayout__main" [class.slayout__main--full]="isFullWidthRoute()">
    <div class="slayout__inner" [class.slayout__inner--full]="isFullWidthRoute()">
      <router-outlet />
    </div>
  </main>

</div>
