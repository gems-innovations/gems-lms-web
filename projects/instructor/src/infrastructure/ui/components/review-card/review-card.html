<article class="rcard">
  <div class="rcard__head">
    <lib-avatar [name]="review().studentName" size="sm" />
    <div class="rcard__who">
      <span class="rcard__name">{{ review().studentName }}</span>
      <span class="rcard__course">{{ review().courseTitle }}</span>
    </div>
    <div class="rcard__stars">
      @for (filled of stars(); track $index) {
        <svg width="13" height="13" viewBox="0 0 24 24"
             [attr.fill]="filled ? 'currentColor' : 'none'"
             stroke="currentColor" stroke-width="1.5"
             [class.rcard__star--on]="filled" [class.rcard__star--off]="!filled">
          <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
        </svg>
      }
    </div>
  </div>

  <p class="rcard__comment">{{ review().comment }}</p>

  <span class="rcard__date">{{ review().createdAt | date:'d MMM y' }}</span>
</article>
