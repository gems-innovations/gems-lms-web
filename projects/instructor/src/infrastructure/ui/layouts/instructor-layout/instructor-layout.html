<div class="ilayout">

  <lib-app-sidebar
    brandRoute="/instructor/courses"
    storageKey="gems-il-collapsed"
    profileRoute="/instructor/profile"
    [menuItems]="menuItems"
    [userProfile]="userProfile()"
    (onLogout)="logout()"
  >
    <edu-notification-bell sidebar-notifications [footer]="true" />
  </lib-app-sidebar>

  <!-- ── Main content ─────────────────────────────────────────────────────── -->
  <main class="ilayout__main" tabindex="0" aria-label="Contenido" [class.ilayout__main--full]="isFullWidthRoute()">
    <div class="ilayout__inner" [class.ilayout__inner--full]="isFullWidthRoute()">
      <router-outlet />
    </div>
  </main>

</div>
