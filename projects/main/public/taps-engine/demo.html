<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Taps Engine · demo del motor</title>
<link rel="stylesheet" href="taps-engine.css">
<style>
  /* los colores de la tarjeta salen del tema (--accent, --good, --bad, --font); estos son los del tema de bloques */
  :root { --accent: #c6f66a; --good: #1f6b2a; --good-line: #7bdc4a; --bad: #7a2020; --bad-line: #ff6a5a; --ink: #1b2414; --line: #3a4a2a; --soft: #d7e6c8; --font: system-ui, sans-serif; }
  html, body { margin: 0; height: 100%; background: #0b0d09; color: #fff; font-family: system-ui, sans-serif; }
  #phone { position: relative; height: 100dvh; max-width: 480px; margin: 0 auto; overflow: hidden; }
  #card { position: absolute; left: 0; right: 0; bottom: 0; padding: 16px 16px max(16px, env(safe-area-inset-bottom)); background: linear-gradient(transparent, rgba(8, 10, 6, .94) 22%); }
  #q { font-size: 1.15rem; font-weight: 700; margin: 0 0 12px; text-shadow: 0 2px 0 #000; font-family: var(--font); }
  #opts { display: grid; gap: 8px; }
  #opts button { min-height: 52px; padding: 10px 14px; border-radius: 10px; border: 2px solid var(--line); background: var(--ink); color: #fff; font: inherit; text-align: left; }
  #opts button.ok { background: var(--good); border-color: var(--good-line); } #opts button.bad { background: var(--bad); border-color: var(--bad-line); }
  #why { margin: 10px 0 0; font-size: .9rem; color: var(--soft); } #next { margin-top: 10px; min-height: 48px; width: 100%; border-radius: 10px; border: 0; background: var(--accent); color: #111; font-weight: 800; }
  #hud { position: absolute; top: 8px; left: 12px; right: 12px; display: flex; justify-content: space-between; z-index: 3; font-size: .85rem; text-shadow: 0 1px 2px #000; }
  #info { position: fixed; top: 4px; left: 4px; font: 11px monospace; color: #9f9; z-index: 9; }
</style>
</head>
<body>
<div id="phone">
  <div id="stage" style="position:absolute;inset:0"></div>
  <div id="hud"><span id="kick"></span><span id="prog"></span></div>
  <div id="card"><p id="q"></p><div id="opts"></div><p id="why" hidden></p><button id="next" hidden>Siguiente</button></div>
</div>
<div id="info" hidden></div>
<script type="module">
// Demo mínima: el motor (taps-engine.js) no sabe de quizzes; aquí un quiz de unas 50 líneas lo maneja.
// Parámetros: ?tap=<archivo de taps/> · mode=light|3d · degrade=0 · reduced=1 · world= host= item= (probar otra escena) · debug
import { create } from './taps-engine.js';
const params = new URLSearchParams(location.search);
const $ = id => document.getElementById(id);
const t0 = performance.now();
const tap = await (await fetch(`taps/${params.get('tap') || 'redstone'}.json`)).json();
const scene = { ...tap.scene, ...Object.fromEntries(['world', 'host', 'item', 'shot', 'props', 'camara', 'hora', 'clima', 'fauna', 'transicion'].filter(k => params.has(k)).map(k => [k, params.get(k)])) };
const stage = create($('stage'), { theme: `themes/${tap.theme}/theme.json`, mode: params.get('mode') || 'auto', degrade: params.get('degrade') !== '0',
  ...(params.has('reduced') ? { reducedMotion: params.get('reduced') !== '0' } : {}) });
window.stage = stage;
let i = 0, score = 0, locked = false;
if (params.has('debug')) $('info').hidden = false;
const info = () => { $('info').textContent = `tema=${tap.theme} modo=${stage.mode} nivel=${stage.tier} pregunta=${Math.round(window.__firstQuestionAt)}ms escenario=${Math.round(window.__modeAt ?? 0)}ms`; };
stage.on('mode', () => { window.__modeAt = performance.now() - t0; info(); });
function show() {
  const q = tap.questions[i]; locked = false;
  $('kick').textContent = tap.kicker + ' · ' + tap.title; $('prog').textContent = `${i + 1} / ${tap.questions.length}`;
  $('q').textContent = q.q; $('why').hidden = true; $('next').hidden = true;
  $('opts').replaceChildren(...q.options.map((o, k) => Object.assign(document.createElement('button'), { textContent: o, onclick: () => answer(k) })));
  stage.react('ask');
  window.__firstQuestionAt ??= performance.now() - t0;
}
function answer(k) {
  if (locked) return; locked = true; const q = tap.questions[i], good = k === q.answer; if (good) score++;
  [...$('opts').children].forEach((b, n) => { b.classList.toggle('ok', n === q.answer); b.classList.toggle('bad', n === k && !good); });
  $('why').textContent = q.why; $('why').hidden = false; stage.react(good ? 'celebrate' : 'hurt');
  $('next').hidden = false; $('next').textContent = i === tap.questions.length - 1 ? 'Ver mi título' : 'Siguiente';
}
$('next').onclick = () => { i++; if (i < tap.questions.length) return show(); finish(); };
function finish() {
  const r = [...tap.results].reverse().find(x => score >= x.min);
  $('q').textContent = `${score} de ${tap.questions.length}: ${r.title}`; $('opts').replaceChildren(); $('why').textContent = r.line; $('why').hidden = false; $('next').hidden = true;
  stage.react(score >= 3 ? 'win' : 'lose'); stage.say(r.title, { hold: true, ms: 0, tone: score >= 3 ? 'celebrate' : 'hurt' });
}
// la pregunta se puede tocar YA (no espera al tema); el escenario llega después
show();
await stage.ready;
const pal = stage.theme.palette || {}, root = document.documentElement.style;
if (tap.theme !== 'minecraft') {                 // tarjeta con los colores del tema (la de bloques queda como estaba)
  root.setProperty('--accent', pal.accent); root.setProperty('--good', pal.good + '33'); root.setProperty('--good-line', pal.good);
  root.setProperty('--bad', pal.bad + '33'); root.setProperty('--bad-line', pal.bad); root.setProperty('--ink', 'rgba(255,255,255,.08)');
  root.setProperty('--line', 'rgba(255,255,255,.18)'); root.setProperty('--soft', '#E9E6FF');
  if (stage.theme.font?.family) root.setProperty('--font', `'${stage.theme.font.family}', system-ui, sans-serif`);
}
await stage.setScene(scene);
if (i === 0 && !locked) stage.react('ask');
info();
</script>
</body>
</html>
