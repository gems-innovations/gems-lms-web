<a class="skip-link" href="#main-content">Ir al contenido principal</a>

<!-- Degradado de marca para los iconos destacados (.gm-icono--destacado usa stroke: url(#gm-degradado-icono)). -->
<svg width="0" height="0" aria-hidden="true" focusable="false" style="position: absolute">
  <defs>
    <linearGradient id="gm-degradado-icono" x1="2" y1="2" x2="22" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C471ED" />
      <stop offset=".5" stop-color="#7B6FF0" />
      <stop offset="1" stop-color="#4DE1FF" />
    </linearGradient>
  </defs>
</svg>

<!-- Diferidos: no pesan en el bundle inicial (la primera carga ya tiene la pantalla de arranque de index.html). -->
@defer (on idle) { <lib-route-progress [active]="navigating()" /> }
@defer (on idle; when !appStatus.online()) {
  <lib-connection-status [online]="appStatus.online()" [placement]="tapsPage() ? 'bottom' : 'top'" />
}

@if (appStatus.updateReady()) {
  <aside class="update-notice" role="status" aria-live="polite">
    <div>
      <strong>Nueva versión disponible</strong>
      <span>Actualiza para recibir las últimas mejoras.</span>
    </div>
    <button type="button" (click)="appStatus.applyUpdate()">Actualizar</button>
  </aside>
}

<div id="main-content" tabindex="-1"><router-outlet /></div>
<app-command-palette />
<lib-toast-container />
<gems-guest-save-bar />

@if (session.user() && !publicPage() && !isGuest()) {
  <button class="app-tour-button" type="button" (click)="onboarding.start()"
    title="Ver guía de la plataforma" aria-label="Ver guía de la plataforma">?</button>
}
