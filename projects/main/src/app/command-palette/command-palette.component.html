@if (open()) {
  <div class="command-palette__backdrop" (click)="close()">
    <section class="command-palette" role="dialog" aria-modal="true" aria-labelledby="command-palette-title" (click)="$event.stopPropagation()">
      <div class="command-palette__search">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
        <input #searchInput [value]="query()" (input)="query.set($any($event.target).value)" (keydown)="selectFirst($event)" placeholder="Busca una sección o acción…" aria-label="Buscar una sección o acción" aria-controls="command-results" />
        <kbd>Esc</kbd>
      </div>
      <h2 id="command-palette-title" class="sr-only">Navegación rápida</h2>
      <div id="command-results" class="command-palette__results" role="listbox" aria-label="Resultados">
        @for (command of commands(); track command.route) {
          <button type="button" role="option" (click)="go(command)">
            <span><strong>{{ command.label }}</strong><small>{{ command.description }}</small></span>
            <span class="command-palette__enter">↵</span>
          </button>
        } @empty {
          <p>No hay resultados para esta búsqueda.</p>
        }
      </div>
      <footer><span><kbd>Ctrl</kbd> <kbd>K</kbd> para abrir</span><span>Selecciona una opción</span></footer>
    </section>
  </div>
}
