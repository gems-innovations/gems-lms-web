<main class="not-found" aria-labelledby="not-found-title">
  <div class="not-found__glow" aria-hidden="true"></div>
  <section class="not-found__card">
    <span class="not-found__code" aria-hidden="true">404</span>
    <p class="not-found__eyebrow">Página no encontrada</p>
    <h1 id="not-found-title">Este enlace no lleva a ningún contenido</h1>
    <p class="not-found__description">
      Es posible que la dirección haya cambiado o que el contenido ya no esté disponible.
    </p>
    <a class="not-found__action" [routerLink]="homePath">Volver al inicio</a>
  </section>
</main>
