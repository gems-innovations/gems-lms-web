<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>GEMS LMS</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="logo-192.png">
  <!-- Fuente de interfaz (un archivo variable, 27 KB): se pide en paralelo con el CSS para que el texto no salte. -->
  <link rel="preload" href="/fonts/plus-jakarta-sans-latin-var.woff2" as="font" type="font/woff2" crossorigin>
  <meta name="theme-color" content="#17152a">
  <meta name="description" content="GEMS LMS: aprendizaje, formación y seguimiento en un solo lugar.">
  <!-- Tarjeta genérica al compartir. Las páginas públicas prerenderizadas traen la suya (SeoService). -->
  <meta property="og:site_name" content="GEMS LMS">
  <meta property="og:type" content="website">
  <meta property="og:title" content="GEMS LMS">
  <meta property="og:description" content="Cursos gratis y sin registro, retos de lógica y quizzes para jugar. Aprendizaje, formación y seguimiento en un solo lugar.">
  <meta property="og:image" content="https://lms.gemsinnovations.com/og/gems-lms.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <script>
    try {
      const preference = JSON.parse(localStorage.getItem('gems-display-preferences') || '{}').theme;
      const branding = JSON.parse(localStorage.getItem('gems_session') || '{}').branding;
      document.documentElement.classList.toggle('light-mode',
        preference === 'light' || (preference !== 'dark' && branding?.darkMode === false));
    } catch { document.documentElement.classList.remove('light-mode'); }
  </script>
  <script>
    // Taps (/taps): la primera pregunta responde antes de que Angular hidrate. Solo pinta la señal (colores, vibración)
    // sobre el HTML del servidor; Angular repite el mismo toque al hidratar (event replay) y sigue desde ahí.
    // En cualquier otra página no hace nada: sale en la primera línea si el toque no es una opción de un Tap.
    document.addEventListener('click', function (e) {
      var b = e.target && e.target.closest && e.target.closest('.tap__opt');
      if (!b || document.documentElement.hasAttribute('data-taps-live')) return;
      var g = b.parentElement, s = b.closest('.tap');
      if (!g || !g.hasAttribute('data-ans') || !s || s.hasAttribute('data-pre')) return;
      var k = Array.prototype.indexOf.call(g.children, b), a = +g.getAttribute('data-ans'), ok = k === a;
      s.setAttribute('data-pre', ok ? 'ok' : 'bad');
      b.classList.add(ok ? 'pre-ok' : 'pre-bad');
      if (g.children[a]) g.children[a].classList.add('pre-ok');
      window.__tapsPre = { id: s.getAttribute('data-tap'), k: k, t: performance.now() };
      try { if (navigator.vibrate) navigator.vibrate(ok ? 15 : [30, 40, 30]); } catch (_) {}
    }, true);
  </script>
  <!-- Runtime configuration (API URL); see public/config.js -->
  <script src="config.js"></script>
  <!-- GoatCounter: estadísticas de visitas sin cookies. AnalyticsService cuenta cada página desde el router. -->
  <script id="goatcounter-script" async src="https://gc.zgo.at/count.js"
          data-goatcounter="https://infogems.goatcounter.com/count"
          data-goatcounter-settings='{"no_onload": true}'></script>
</head>
<body>
  <app-root></app-root>
  <!--
    Pantalla de arranque (ESTADOS-DE-CARGA.md §Primer arranque): se pinta con el HTML, antes de que llegue el JS de
    Angular, y se funde cuando la primera página ya está pintada (arranque.ts). Si la página llegó prerenderizada
    (<app-root> trae contenido) no se muestra: el contenido real ya está ahí. Sin JS no aparece.
  -->
  <style>
    #gems-arranque{display:none}
    .gems-arrancando #gems-arranque{position:fixed;inset:0;z-index:2000;display:grid;place-content:center;justify-items:center;gap:14px;
      background:#080710;color:#edeaf8;font:600 15px/1.4 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;text-align:center;
      transition:opacity .22s cubic-bezier(.4,0,.2,1)}
    .light-mode #gems-arranque{background:#f4f6fb;color:#1a202c}
    #gems-arranque.ga-fuera{opacity:0;pointer-events:none}
    #gems-arranque img{width:72px;height:72px;opacity:0;transition:opacity .2s;animation:ga-respira 2.4s ease-in-out infinite}
    #gems-arranque img.ga-ok{opacity:1}
    #gems-arranque .ga-marca{font-weight:800;font-size:17px;letter-spacing:.02em}
    /* Subdominio de una institución: arranque neutro (zorro pequeño y barra gris, sin el nombre GEMS) hasta que llegue su marca. */
    #gems-arranque.ga-neutro img{width:40px;height:40px}
    #gems-arranque.ga-neutro .ga-marca{display:none}
    #gems-arranque.ga-neutro .ga-barra{background:rgba(128,128,128,.22)}
    #gems-arranque.ga-neutro .ga-barra i{background:rgba(128,128,128,.7)}
    #gems-arranque .ga-barra{width:120px;height:3px;border-radius:3px;overflow:hidden;background:rgba(123,111,240,.18)}
    #gems-arranque .ga-barra i{display:block;width:40%;height:100%;border-radius:3px;background:linear-gradient(90deg,#7b6ff0,#4de1ff);animation:ga-barra 1.3s cubic-bezier(.4,0,.2,1) infinite}
    #gems-arranque .visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
    #gems-arranque .ga-aviso{min-height:2.8em;max-width:30ch;margin:4px 0 0;font-weight:500;font-size:14px;opacity:.75}
    #gems-arranque button{display:none;min-height:44px;padding:0 20px;border:0;border-radius:12px;background:#5b4ec1;color:#fff;font:700 15px/1 inherit;cursor:pointer}
    #gems-arranque.ga-lento .ga-aviso::after{content:'Tu conexión va lenta; ya casi está.'}
    #gems-arranque.ga-fallo .ga-aviso::after{content:'No pudimos abrir GEMS. Revisa tu conexión y vuelve a intentarlo.'}
    #gems-arranque.ga-fallo button,#gems-arranque.ga-muy-lento button{display:inline-block}
    #gems-arranque.ga-fallo .ga-barra{visibility:hidden}
    @keyframes ga-respira{50%{transform:scale(1.05);opacity:.85}}
    @keyframes ga-barra{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
    @media (prefers-reduced-motion:reduce){#gems-arranque img,#gems-arranque .ga-barra i{animation:none}#gems-arranque .ga-barra i{width:100%;opacity:.5}}
  </style>
  <div id="gems-arranque" role="status">
    <!-- El logo aparece entero (no a medio decodificar en redes lentas); su espacio está reservado. -->
    <img src="logo-144.png" width="72" height="72" alt="" fetchpriority="high" onload="this.classList.add('ga-ok')">
    <span class="ga-marca">GEMS LMS</span>
    <span class="ga-barra" aria-hidden="true"><i></i></span>
    <p class="ga-aviso"><span class="visually-hidden">Cargando GEMS LMS</span></p>
    <button type="button">Recargar</button>
  </div>
  <script>
    (function () {
      var raiz = document.querySelector('app-root'), el = document.getElementById('gems-arranque');
      if (!raiz || !el || raiz.firstElementChild) { if (el) el.remove(); return; }
      // ¿Host de una institución (<slug>.<dominio base> o <slug>.localhost)? Mismas reglas que tenant-slug.ts
      // (resolveTenantSlug): si cambian allí, cambian aquí. Solo toca el cliente: el HTML prerenderizado no cambia.
      try {
        var host = location.hostname.toLowerCase(), base = (globalThis.TENANT_BASE_DOMAIN || 'gemsinnovations.com').toLowerCase().replace(/^\./, '');
        var reservados = 'www lms api app admin auth edu mail static assets cdn dev qa pdn prod staging test preview'.split(' ');
        [base, 'localhost'].forEach(function (sufijo) {
          if (!sufijo || host.slice(-(sufijo.length + 1)) !== '.' + sufijo) return;
          var etiqueta = host.slice(0, -(sufijo.length + 1));
          if (/^[a-z0-9][a-z0-9-]{1,38}[a-z0-9]$/.test(etiqueta) && reservados.indexOf(etiqueta) < 0) {
            el.classList.add('ga-neutro');
            var oculto = el.querySelector('.visually-hidden');
            if (oculto) oculto.textContent = 'Cargando';
          }
        });
      } catch (_) {}
      document.documentElement.classList.add('gems-arrancando');
      el.querySelector('button').addEventListener('click', function () { location.reload(); });
      setTimeout(function () { el.classList.add('ga-lento'); }, 6000);
      setTimeout(function () { el.classList.add('ga-muy-lento'); }, 20000);
    })();
  </script>
</body>
</html>
