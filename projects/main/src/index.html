<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>GEMS LMS</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="logo-192.png">
  <meta name="theme-color" content="#17152a">
  <meta name="description" content="GEMS LMS: aprendizaje, formación y seguimiento en un solo lugar.">
  <script>
    try {
      const preference = JSON.parse(localStorage.getItem('gems-display-preferences') || '{}').theme;
      const branding = JSON.parse(localStorage.getItem('gems_session') || '{}').branding;
      document.documentElement.classList.toggle('light-mode',
        preference === 'light' || (preference !== 'dark' && branding?.darkMode === false));
    } catch { document.documentElement.classList.remove('light-mode'); }
  </script>
  <!-- Runtime configuration (API URL); see public/config.js -->
  <script src="config.js"></script>
  <!-- GoatCounter: estadísticas de visitas sin cookies. AnalyticsService cuenta cada página desde el router. -->
  <script id="goatcounter-script" async src="https://gc.zgo.at/count.js"
          data-goatcounter="https://infogems.goatcounter.com/count"
          data-goatcounter-settings='{"no_onload": true}'></script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
