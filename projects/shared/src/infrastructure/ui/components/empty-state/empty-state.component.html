<div class="empty">
  <div class="empty__icon">
    @if (svgIcon()) {
      <span [innerHTML]="svgIcon()"></span>
    } @else {
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="4" y="4" width="16" height="16" rx="4" />
        <path d="M8 12h8M12 8v8" />
      </svg>
    }
  </div>

  <h3 class="empty__title">{{ title() }}</h3>

  @if (description()) {
    <p class="empty__desc">{{ description() }}</p>
  }

  @if (actionLabel()) {
    <button class="empty__btn" type="button" (click)="onAction()">
      {{ actionLabel() }}
    </button>
  }

  <!-- Optional extra content slot -->
  <ng-content />
</div>
