@if (type() === 'table') {
  <div class="skeleton-table" role="status">
    @for (row of rowsArray(); track $index) {
      <article class="skeleton-row" aria-hidden="true">
        <div class="skeleton-cell skeleton-avatar"></div>
        <div class="skeleton-cell skeleton-text skeleton-text-lg"></div>
        <div class="skeleton-cell skeleton-badge"></div>
        <div class="skeleton-cell skeleton-badge"></div>
        <div class="skeleton-cell skeleton-text skeleton-text-sm"></div>
        <div class="skeleton-cell skeleton-text skeleton-text-sm"></div>
        <div class="skeleton-cell skeleton-actions">
          <div class="skeleton-icon"></div>
          <div class="skeleton-icon"></div>
          <div class="skeleton-icon"></div>
        </div>
      </article>
    }
    <span class="sr-only">{{ label() }}…</span>
  </div>
} @else {
  <div class="skeleton-cards" role="status">
    @for (row of rowsArray(); track $index) {
      <article class="skeleton-card" aria-hidden="true">
        <header class="skeleton-card-header">
          <div class="skeleton-cell skeleton-avatar"></div>
          <div class="skeleton-cell skeleton-text skeleton-text-lg"></div>
        </header>
        <div class="skeleton-card-body">
          <div class="skeleton-cell skeleton-text skeleton-text-sm"></div>
          <div class="skeleton-cell skeleton-text skeleton-text-sm"></div>
          <div class="skeleton-cell skeleton-badge"></div>
        </div>
      </article>
    }
    <span class="sr-only">{{ label() }}…</span>
  </div>
}
