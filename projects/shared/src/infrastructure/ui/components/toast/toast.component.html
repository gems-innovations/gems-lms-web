@if (isVisible()) {
  <div class="toast toast--{{ type() }}" [@slideIn]>
    <div class="toast__icon">{{ getIcon() }}</div>
    <p class="toast__message">{{ message() }}</p>
    <button 
      type="button" 
      class="toast__close" 
      (click)="handleClose()"
      aria-label="Cerrar notificación"
    >
      ✕
    </button>
  </div>
}
