@if (isVisible()) {
  <div class="toast toast--{{ type() }}" [attr.role]="type() === 'error' ? 'alert' : 'status'">
    <!-- Iconos de Lucide (ISC) en línea: ver el comentario de ToastComponent. -->
    <div class="toast__icon">
      <svg class="lucide" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        @switch (type()) {
          @case ('error') {
            <svg:circle cx="12" cy="12" r="10" /><svg:path d="m15 9-6 6" /><svg:path d="m9 9 6 6" />
          }
          @case ('warning') {
            <svg:path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3" />
            <svg:path d="M12 9v4" /><svg:path d="M12 17h.01" />
          }
          @case ('info') {
            <svg:circle cx="12" cy="12" r="10" /><svg:path d="M12 16v-4" /><svg:path d="M12 8h.01" />
          }
          @default {
            <svg:circle cx="12" cy="12" r="10" /><svg:path d="m16 9-5.5 5.5L8 12" />
          }
        }
      </svg>
    </div>
    <p class="toast__message">{{ message() }}</p>
    <button
      type="button"
      class="toast__close"
      (click)="handleClose()"
      aria-label="Cerrar notificación"
    >
      <svg class="lucide" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M18 6 6 18" /><path d="m6 6 12 12" />
      </svg>
    </button>
  </div>
}
