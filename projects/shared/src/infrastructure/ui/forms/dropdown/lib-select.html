<div
  #rootEl
  class="lib-select"
  [class.lib-select--disabled]="disabled()"
>
  @if (label()) {
    <label [for]="selectId()" class="lib-select__label">
      {{ label() }}
      @if (required()) {
        <span class="lib-select__required">*</span>
      }
    </label>
  }

  <div class="lib-select__wrapper">
    <button
      [id]="selectId()"
      type="button"
      class="lib-select__trigger"
      [class.lib-select__trigger--open]="open()"
      [class.lib-select__trigger--placeholder]="!selectedOption()"
      [disabled]="disabled()"
      (click)="toggle()"
    >
      @if (icon()) {
        <span class="lib-select__icon">{{ icon() }}</span>
      }
      <span class="lib-select__trigger-label">
        {{ selectedOption()?.label ?? placeholder() }}
      </span>
      <svg class="lib-select__chevron" [class.lib-select__chevron--open]="open()"
           width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <polyline points="6 9 12 15 18 9"/>
      </svg>
    </button>

    @if (open()) {
      <div class="lib-select__backdrop" (click)="close()"></div>

      <div class="lib-select__panel">
        @if (showSearch()) {
          <div class="lib-select__search-wrap">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            <input
              #searchInput
              class="lib-select__search"
              type="text"
              [placeholder]="'Buscar…'"
              [value]="search()"
              (input)="search.set($any($event.target).value)"
              (keydown)="onSearchKeydown($event)"
            />
          </div>
        }

        <div class="lib-select__options" [style.maxHeight.px]="maxHeight()">
          @if (filteredOptions().length === 0) {
            <div class="lib-select__empty">Sin resultados</div>
          } @else {
            @for (opt of filteredOptions(); track opt.value) {
              <button
                type="button"
                class="lib-select__option"
                [class.lib-select__option--active]="opt.value === value()"
                [class.lib-select__option--disabled]="opt.disabled"
                [disabled]="opt.disabled"
                (click)="selectOption(opt)"
              >
                <span class="lib-select__option-label">{{ opt.label }}</span>
                @if (opt.value === value()) {
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <polyline points="20 6 9 17 4 12"/>
                  </svg>
                }
              </button>
            }
          }
        </div>
      </div>
    }
  </div>

  @if (helpText()) {
    <span class="lib-select__help">{{ helpText() }}</span>
  }
</div>
